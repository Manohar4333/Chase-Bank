<table class="table table-bordered table-hovered">
    <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Mobile</th>
        <th>Gender</th>
        <th>Account type</th>
        <th>Branch</th>
    </tr>
    <tr *ngFor="let a of customers">
        <td>{{a.name}}</td>
        <td>{{a.email}}</td>
        <td>{{a.mobile}}</td>
        <td>{{a.gender}}</td>
        <td>{{a.accountType}}</td>
        <td>{{a.branch}}</td>
    </tr>
</table>
